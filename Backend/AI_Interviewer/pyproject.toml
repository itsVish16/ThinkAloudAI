[project]
name = "ai-interviewer"
version = "0.1.0"
description = "Real-time AI Voice Interviewer Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddtrace>=2.19.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.4",
    "livekit-agents[openai,silero,speechmatics]==1.4.2",
    "livekit-plugins-cartesia>=1.4.2",
    "livekit-plugins-sarvam>=0.1.0",
    "sarvamai>=0.1.30",
    "livekit-api>=1.1.0",
    "ollama>=0.6.2",
    "websockets>=15.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "greenlet>=3.0.3",
    "alembic>=1.18.4",
    "opik>=2.0.73",
    "aio-pika>=9.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
