# ThinkAloud.AI Backend - single VM deployment stack
#
# Services:
#   - postgres: one shared PostgreSQL instance with one database per service
#   - redis: one shared Redis instance, isolated by logical DB number
#   - caddy: public HTTPS reverse proxy and automatic TLS
#   - datadog-agent: metrics, logs, APM receiver
#   - user-service: auth, users, profile, email/event handling
#   - main-service: chat, DSA, roadmaps, code execution
#   - ai-interviewer-api: LiveKit token/interview API
#   - ai-interviewer-worker: LiveKit realtime worker
#
# Usage:
#   cp .env.example .env
#   edit .env
#   docker compose up -d --build

name: thinkaloud-backend

x-common-env: &common-env
  DD_AGENT_HOST: datadog-agent
  DD_TRACE_AGENT_PORT: "8126"
  DD_DOGSTATSD_PORT: "8125"
  DD_ENV: ${DD_ENV:-production}
  DD_VERSION: ${APP_VERSION:-latest}
  DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
  DD_LOGS_INJECTION: ${DD_LOGS_INJECTION:-true}

x-service-defaults: &service-defaults
  init: true
  networks:
    - thinkaloud
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    container_name: thinkaloud-caddy
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:-admin@thinkaloudai.tech}
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      user-service:
        condition: service_healthy
      main-service:
        condition: service_healthy
      ai-interviewer-api:
        condition: service_healthy
    networks:
      - thinkaloud
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: thinkaloud-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/001-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - thinkaloud
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: thinkaloud-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - thinkaloud
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: thinkaloud-datadog-agent
    environment:
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY is required}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-production}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE_LOGS: "name:thinkaloud-datadog-agent"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_DOCKER_LABELS_AS_TAGS: '{"com.thinkaloud.service":"service"}'
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:8126:8126/tcp"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - thinkaloud
    restart: unless-stopped

  user-service:
    <<: *service-defaults
    build:
      context: ./Scalable_User_Service
    container_name: thinkaloud-user-service
    entrypoint: ["docker/start.sh"]
    environment:
      <<: *common-env
      DD_SERVICE: user-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_service
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${USER_SERVICE_DEBUG:-false}
      SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      ENABLE_RATE_LIMITING: ${ENABLE_RATE_LIMITING:-true}
      RATE_LIMIT_TRUST_PROXY_HEADERS: ${RATE_LIMIT_TRUST_PROXY_HEADERS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_EMAIL_QUEUE_URL: ${SQS_EMAIL_QUEUE_URL:-}
      UVICORN_WORKERS: ${USER_SERVICE_WORKERS:-2}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${USER_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()\""
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    labels:
      com.thinkaloud.service: user-service
      com.datadoghq.tags.service: user-service
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.ad.logs: '[{"source":"python","service":"user-service"}]'

  main-service:
    <<: *service-defaults
    build:
      context: ./main_service
    container_name: thinkaloud-main-service
    environment:
      <<: *common-env
      DD_SERVICE: main-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/main_service
      UPSTASH_REDIS_URL: redis://redis:6379/1
      USER_SERVICE_URL: http://user-service:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      FEATHERLESS_BASE_URL: ${FEATHERLESS_BASE_URL:-https://api.featherless.ai/v1}
      FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:?FEATHERLESS_API_KEY is required}
      FEATHERLESS_MODEL: ${FEATHERLESS_MODEL:-deepseek-ai/DeepSeek-V3-0324}
      AIML_API_KEY: ${AIML_API_KEY:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      OPIK_API_KEY: ${OPIK_API_KEY:-}
      OPIK_WORKSPACE: ${OPIK_WORKSPACE:-default}
      OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME:-ThinkAloud.ai}
      SPEECHMATICS_API_KEY: ${SPEECHMATICS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${MAIN_SERVICE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3).read()\""
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    labels:
      com.thinkaloud.service: main-service
      com.datadoghq.tags.service: main-service
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.ad.logs: '[{"source":"python","service":"main-service"}]'

  ai-interviewer-api:
    <<: *service-defaults
    build:
      context: ./AI_Interviewer
      target: api
    container_name: thinkaloud-ai-interviewer-api
    environment:
      <<: *common-env
      DD_SERVICE: ai-interviewer-api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/interviewer_service
      REDIS_URL: redis://redis:6379/2
      USER_SERVICE_URL: http://user-service:8000
      USER_SERVICE_JWT_SECRET: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      USER_SERVICE_JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      MAIN_SERVICE_URL: http://main-service:8001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      SPEECHMATICS_API_KEY: ${SPEECHMATICS_API_KEY:-}
      FEATHERLESS_BASE_URL: ${FEATHERLESS_BASE_URL:-https://api.featherless.ai/v1}
      FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:?FEATHERLESS_API_KEY is required}
      FEATHERLESS_MODEL: ${FEATHERLESS_MODEL:-deepseek-ai/DeepSeek-V3-0324}
      OPIK_API_KEY: ${OPIK_API_KEY:-}
      OPIK_WORKSPACE: ${OPIK_WORKSPACE:-default}
      OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME:-ThinkAloud.ai}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      AUTH_BYPASS: "false"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${AI_INTERVIEWER_API_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      main-service:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/interview-types', timeout=3).read()\""
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      com.thinkaloud.service: ai-interviewer-api
      com.datadoghq.tags.service: ai-interviewer-api
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.ad.logs: '[{"source":"python","service":"ai-interviewer-api"}]'

  ai-interviewer-worker:
    <<: *service-defaults
    build:
      context: ./AI_Interviewer
      target: worker
    container_name: thinkaloud-ai-interviewer-worker
    environment:
      <<: *common-env
      DD_SERVICE: ai-interviewer-worker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/interviewer_service
      REDIS_URL: redis://redis:6379/2
      USER_SERVICE_URL: http://user-service:8000
      USER_SERVICE_JWT_SECRET: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      USER_SERVICE_JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      MAIN_SERVICE_URL: http://main-service:8001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      SPEECHMATICS_API_KEY: ${SPEECHMATICS_API_KEY:-}
      FEATHERLESS_BASE_URL: ${FEATHERLESS_BASE_URL:-https://api.featherless.ai/v1}
      FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:?FEATHERLESS_API_KEY is required}
      FEATHERLESS_MODEL: ${FEATHERLESS_MODEL:-deepseek-ai/DeepSeek-V3-0324}
      OPIK_API_KEY: ${OPIK_API_KEY:-}
      OPIK_WORKSPACE: ${OPIK_WORKSPACE:-default}
      OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME:-ThinkAloud.ai}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      AUTH_BYPASS: "false"
    depends_on:
      ai-interviewer-api:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    labels:
      com.thinkaloud.service: ai-interviewer-worker
      com.datadoghq.tags.service: ai-interviewer-worker
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.ad.logs: '[{"source":"python","service":"ai-interviewer-worker"}]'

networks:
  thinkaloud:
    name: thinkaloud-backend
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
