name: thinkaloud-backend
x-common-env:
  DD_AGENT_HOST: datadog-agent
  DD_TRACE_AGENT_PORT: '8126'
  DD_DOGSTATSD_PORT: '8125'
  DD_ENV: ${DD_ENV:-production}
  DD_VERSION: ${APP_VERSION:-latest}
  DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
  DD_LOGS_INJECTION: ${DD_LOGS_INJECTION:-true}
x-service-defaults:
  init: true
  networks: &id001
  - thinkaloud
  restart: unless-stopped
  logging: &id002
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'
services:
  caddy:
    image: caddy:alpine
    container_name: thinkaloud-caddy
    ports:
    - ${PUBLIC_HTTP_PORT:-80}:80
    - "443:443"
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
      user-service:
        condition: service_healthy
      main-service:
        condition: service_healthy
      ai-interviewer-api:
        condition: service_healthy
    networks:
    - thinkaloud
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: thinkaloud-datadog-agent
    environment:
      DD_API_KEY: ${DD_API_KEY:-dev_dummy_key}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-production}
      DD_APM_ENABLED: 'true'
      DD_APM_NON_LOCAL_TRAFFIC: 'true'
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: 'true'
      DD_LOGS_ENABLED: 'true'
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: 'true'
      DD_CONTAINER_EXCLUDE_LOGS: name:thinkaloud-datadog-agent
      DD_PROCESS_AGENT_ENABLED: 'true'
      DD_DOCKER_LABELS_AS_TAGS: '{"com.thinkaloud.service":"service"}'
    ports:
    - ${INFRA_BIND_ADDRESS:-127.0.0.1}:8126:8126/tcp
    - ${INFRA_BIND_ADDRESS:-127.0.0.1}:8125:8125/udp
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /proc/:/host/proc/:ro
    - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
    - thinkaloud
    restart: unless-stopped
  user-service:
    init: true
    networks: *id001
    restart: unless-stopped
    logging: *id002
    build:
      context: ./Scalable_User_Service
    container_name: thinkaloud-user-service
    entrypoint:
    - docker/start.sh
    env_file:
      - .env
    ports:
    - ${APP_BIND_ADDRESS:-127.0.0.1}:${USER_SERVICE_PORT:-8000}:8000
    depends_on:
      datadog-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',
        timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    labels:
      com.thinkaloud.service: user-service
      com.datadoghq.tags.service: user-service
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.ad.logs: '[{"source":"python","service":"user-service"}]'
  main-service:
    init: true
    networks: *id001
    restart: unless-stopped
    logging: *id002
    build:
      context: ./main_service
    container_name: thinkaloud-main-service
    env_file:
      - .env
    ports:
    - ${APP_BIND_ADDRESS:-127.0.0.1}:${MAIN_SERVICE_PORT:-8001}:8001
    depends_on:
      user-service:
        condition: service_healthy
      datadog-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/',
        timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    labels:
      com.thinkaloud.service: main-service
      com.datadoghq.tags.service: main-service
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.ad.logs: '[{"source":"python","service":"main-service"}]'
  ai-interviewer-api:
    init: true
    networks: *id001
    restart: unless-stopped
    logging: *id002
    build:
      context: ./AI_Interviewer
      target: api
    container_name: thinkaloud-ai-interviewer-api
    env_file:
      - .env
    environment:
      DD_SERVICE: ai-interviewer-api
    ports:
    - ${APP_BIND_ADDRESS:-127.0.0.1}:${AI_INTERVIEWER_API_PORT:-8002}:8000
    depends_on:
      user-service:
        condition: service_healthy
      main-service:
        condition: service_healthy
      datadog-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/interview-types',
        timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      com.thinkaloud.service: ai-interviewer-api
      com.datadoghq.tags.service: ai-interviewer-api
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.ad.logs: '[{"source":"python","service":"ai-interviewer-api"}]'
  ai-interviewer-worker:
    init: true
    networks: *id001
    restart: unless-stopped
    logging: *id002
    build:
      context: ./AI_Interviewer
      target: worker
    container_name: thinkaloud-ai-interviewer-worker
    env_file:
      - .env
    environment:
      DD_SERVICE: ai-interviewer-worker
    depends_on:
      ai-interviewer-api:
        condition: service_healthy
      datadog-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      com.thinkaloud.service: ai-interviewer-worker
      com.datadoghq.tags.service: ai-interviewer-worker
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.ad.logs: '[{"source":"python","service":"ai-interviewer-worker"}]'
  postgres:
    image: postgres:16-alpine
    container_name: thinkaloud-dev-postgres
    networks: *id001
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thinkaloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinkaloud_dev}
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./init-databases.sql:/docker-entrypoint-initdb.d/001-init-databases.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-thinkaloud}
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: thinkaloud-dev-redis
    networks: *id001
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --loglevel
    - warning
    ports:
    - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: thinkaloud-dev-rabbitmq
    networks: *id001
    ports:
    - 127.0.0.1:${RABBITMQ_PORT:-5672}:5672
    - 127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  ai-interviewer-analysis-worker:
    init: true
    networks: *id001
    restart: unless-stopped
    logging: *id002
    build:
      context: ./AI_Interviewer
      target: analysis_worker
    container_name: thinkaloud-ai-interviewer-analysis-worker
    env_file:
      - .env
    environment:
      DD_SERVICE: ai-interviewer-analysis-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
networks:
  thinkaloud:
    name: thinkaloud-backend
    driver: bridge
volumes:
  postgres-data: null
  redis-data: null
  rabbitmq-data: null
  caddy_data: null
  caddy_config: null
