# Local development infrastructure (Redis + RabbitMQ).
# Database is hosted externally on Azure PostgreSQL.

name: thinkaloud-infra-dev

services:
  redis:
    image: redis:7-alpine
    container_name: thinkaloud-dev-redis
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - dev-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: thinkaloud-dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-thinkaloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-thinkaloud_rabbit_secret}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - dev-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dev-redis-data:
  dev-rabbitmq-data:
