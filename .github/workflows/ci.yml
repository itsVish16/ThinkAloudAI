name: CI Pipeline

on:
  push:
    branches: [ main, "refactor/**", "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-user-service:
    name: Scalable User Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Scalable_User_Service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest
        run: uv run pytest tests/
        env:
          JWT_SECRET_KEY: ci-test-secret-key-must-be-at-least-32-chars-long
          DATABASE_URL: sqlite+aiosqlite:///:memory:

  test-main-service:
    name: Main Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/main_service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest
        run: uv run pytest tests/
        env:
          JWT_SECRET_KEY: ci-test-secret-key-must-be-at-least-32-chars-long
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/1

  test-ai-interviewer:
    name: AI Interviewer Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/AI_Interviewer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest
        run: uv run pytest tests/
        env:
          JWT_SECRET_KEY: ci-test-secret-key-must-be-at-least-32-chars-long
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secretsecretsecretsecretsecret12

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and Typecheck
        run: npm run build

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Backend Docker Compose Config
        run: |
          docker compose -f Backend/docker-compose.yml config --quiet
          docker compose -f Backend/docker-compose.prod.yml config --quiet
